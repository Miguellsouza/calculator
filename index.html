<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <link rel="stylesheet" href="estilizacaocalculadora.css">
    <link rel="icon" href="logo.webp">

    <title>Calculadora</title>
</head>
<body>
    <div style="display: flex; flex-direction: row; width: 100%; height: 100vh;">
        <div id="divform">
            <form action="" method="get">
                <fieldset id="fieldsetcalculadora">
                    <p id="resultado"></p>
                    <!--Div dos botões-->
                    <div style="display: flex; flex-direction: row; width: 100%; justify-content: center; padding-top: 20px; margin-top: 25px;">
                        <table>
                            <!--Linha 1-->
                            <tr>
                                <td> <!--celula 1--> 
                                    <button class="button" id="c" type="button" onclick="clean()">
                                        <i class="fa-solid fa-c"></i>
                                    </button>
                                </td>
                                <td> <!--celula 2--> 
                                    <button class="button" style="justify-content: right;" id="delete" onclick="erase()" type="button">
                                        <i class="fa-solid fa-delete-left"></i>
                                    </button>
                                </td>
                                <td> <!--celula 3--> 
                                    <button class="button" id="divide" onclick="insert('/')" type="button">
                                        <i class="fa-solid fa-divide"></i>
                                    </button>
                                </td>
                                <td> <!--celula 4--> 
                                    <button class="button" id="times" onclick="insert('*')" type="button">
                                        <i class="fa-solid fa-xmark"></i>
                                    </button>
                                </td>
                            </tr>
                            <!--Linha 2-->
                            <tr>
                                <td> <!--celula 5--> 
                                    <button class="button" onclick="insert(7)" type="button">
                                        <i class="fa-solid fa-7"></i>
                                    </button>
                                </td>
                                <td> <!--celula 6--> 
                                    <button class="button" onclick="insert(8)" type="button">
                                        <i class="fa-solid fa-8"></i>
                                    </button>
                                </td>
                                <td> <!--celula 7--> 
                                    <button class="button" onclick="insert(9)" type="button">
                                        <i class="fa-solid fa-9"></i>
                                    </button>
                                </td>
                                <td> <!--celula 8--> 
                                    <button class="button" id="minus" onclick="insert('-')" type="button">
                                        <i class="fa-solid fa-minus"></i>
                                    </button>
                                </td>                                
                            </tr>
                            <!--Linha 3-->
                            <tr>
                                <td> <!--celula 9--> 
                                    <button class="button" onclick="insert(4)" type="button">
                                        <i class="fa-solid fa-4"></i>
                                    </button>
                                </td>
                                <td> <!--celula 10--> 
                                    <button class="button" onclick="insert(5)" type="button">
                                        <i class="fa-solid fa-5"></i>
                                    </button>
                                </td>
                                <td> <!--celula 11--> 
                                    <button class="button" onclick="insert(6)" type="button">
                                        <i class="fa-solid fa-6"></i>
                                    </button>
                                </td>
                                <td> <!--celula 12--> 
                                    <button class="button" id="plus" onclick="insert('+')" type="button">
                                        <i class="fa-solid fa-plus"></i>
                                    </button>
                                </td>
                            </tr>
                            <!--Linha 4-->
                            <tr>
                                <td> <!--celula 13--> 
                                    <button class="button" onclick="insert(1)" type="button">
                                        <i class="fa-solid fa-1"></i>
                                    </button>
                                </td>
                                <td> <!--celula 14--> 
                                    <button class="button" onclick="insert(2)" type="button">
                                        <i class="fa-solid fa-2"></i>
                                    </button>
                                </td>
                                <td> <!--celula 15--> 
                                    <button class="button" onclick="insert(3)" type="button">
                                        <i class="fa-solid fa-3"></i>
                                    </button>
                                </td>
                                <td rowspan="2"> <!--celula 17--> 
                                    <button class="button" style="height: 90px;" id="equal" onclick="calcular()" type="button">
                                        <i class="fa-solid fa-equals"></i>
                                    </button>
                                </td>                               
                            </tr>
                            <!--Linha 5-->
                            <tr>
                                <td colspan="2"> <!--celula 16--> 
                                    <button class="button" style="width: 113px;" onclick="insert(0)" type="button">
                                        <i class="fa-solid fa-0"></i>
                                    </button>
                                </td>
                                <td> <!--celula 17--> 
                                    <button class="button" id="point" type="button" onclick="insert('.')">
                                        <h2>.</h2>
                                    </button>
                                </td>
                            </tr>
                        </table>
                    </div>
                </fieldset>
            </form>
        </div>
    </div>
    <script>
        function insert(num){
            document.getElementById("resultado").innerHTML += num
        }
        function calcular(){
            var resultado = document.getElementById('resultado')
            if(resultado){
                document.getElementById('resultado').innerHTML = eval(resultado.innerHTML)
            }
        }
        function clean(){
            var resultado = document.getElementById('resultado')
            resultado.innerHTML = ""
        }
        function erase(){
            var resultado = document.getElementById('resultado').innerHTML
            document.getElementById('resultado').innerHTML = resultado.slice(0, -1)
        }
    </script>
</body>
</html>
